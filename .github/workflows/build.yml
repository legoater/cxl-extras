name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  module:
    runs-on: ubuntu-latest
    container: fedora:rawhide
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: dnf install -y gcc make kernel-devel

      - name: Build kernel module
        run: make modules KDIR=$(ls -d /usr/src/kernels/* | head -n 1)

      - name: Build test application
        run: make cxl_accel_test
